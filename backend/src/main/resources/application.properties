# ===================================================================
# 1. PostgreSQL / Supabase Veritabanı Bağlantısı
# Railway'de ortam değişkeni varsa onu alır, yoksa lokal değerleri kullanır.
# ===================================================================
# Not: Eğer lokalde de Supabase'e bağlanıyorsanız localhost yerine Supabase JDBC URL'inizi yazabilirsiniz.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flovbit}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# 2. JPA & Hibernate Ayarları
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# 3. Sunucu Portu
# Railway PORT değişkenini atar, lokalde 8081 kullanılır
# ===================================================================
server.port=${PORT:8081}

# ===================================================================
# 4. Google OAuth2 Ayarları (Değişken yoksa dummy değere düşer, çökmez)
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dummy-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ===================================================================
# 5. GitHub OAuth2 Ayarları (Değişken yoksa dummy değere düşer, çökmez)
# ===================================================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:dummy-github-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:dummy-github-client-secret}
spring.security.oauth2.client.registration.github.scope=read:user,user:email